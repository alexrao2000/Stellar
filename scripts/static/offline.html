<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>You're offline · Stellar</title>
  <style>
    :root { font-family: system-ui, -apple-system, sans-serif; color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid;
      place-items: center; padding: 24px; background: #f6f6f6; color: #111; }
    main { width: min(100%, 360px); text-align: center; }
    img { border-radius: 20px; }
    h1 { font-size: 1.6rem; margin-top: 24px; }
    p { line-height: 1.6; color: #666; }
    a { display: inline-flex; align-items: center; justify-content: center;
      min-height: 48px; padding: 0 24px; border-radius: 12px; background: #111;
      color: white; text-decoration: none; font-weight: 600; margin-top: 12px; }
    @media (prefers-color-scheme: dark) {
      body { background: #090909; color: #f3f3f3; } p { color: #aaa; } a { background: #f3f3f3; color: #111; }
    }
  </style>
</head>
<body><main>
  <img src="/app-assets/stellar-192.png" width="80" height="80" alt="Stellar">
  <h1>You're offline</h1>
  <p>Connect to the internet to load your tasks and save check-ins.</p>
  <a href="/">Try again</a>
</main></body>
</html>
