<title>Activity · Stellar</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.mono {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-variant-numeric: tabular-nums;
}
.wrap { max-width: 1200px; margin: 0 auto; padding: 28px 18px 64px; }

.eyebrow {
  font-family: ui-monospace, Menlo, monospace; font-size: .66rem;
  letter-spacing: .16em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 8px;
}
h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -.02em; margin: 0 0 6px; }
.sub { color: var(--ink-muted); font-size: .9rem; margin: 0; }

.bar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin: 18px 0 12px; padding: 10px 12px;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 9px;
  box-shadow: var(--shadow);
}
.bar input[type="search"], .bar select {
  font: inherit; font-size: .86rem; padding: 8px 10px; border-radius: 7px;
  border: 1px solid var(--rule); background: var(--bg); color: var(--ink);
}
.bar input[type="search"] { flex: 1; min-width: 160px; }
.count { margin-left: auto; font-size: .78rem; color: var(--ink-muted);
  font-family: ui-monospace, Menlo, monospace; }
.pager { display: flex; gap: 6px; align-items: center; }
.pager button {
  border: 1px solid var(--rule); background: var(--surface); color: var(--ink);
  font: inherit; font-size: .84rem; padding: 7px 12px; border-radius: 7px; cursor: pointer;
}
.pager button:disabled { opacity: .35; cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

.tablewrap {
  background: var(--surface); border: 1px solid var(--rule); border-radius: 9px;
  box-shadow: var(--shadow); overflow-x: auto;
}
table { border-collapse: collapse; width: 100%; font-size: .84rem; }
th, td {
  text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--rule);
  vertical-align: top; white-space: nowrap;
}
th {
  position: sticky; top: 0; background: var(--surface-2); z-index: 1;
  font-size: .66rem; letter-spacing: .09em; text-transform: uppercase;
  color: var(--ink-muted); font-weight: 700;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--surface-2); }
td.notes { white-space: pre-wrap; max-width: 420px; font-size: .78rem;
  font-family: ui-monospace, Menlo, monospace; color: var(--ink-muted); }
.pill {
  display: inline-block; padding: 1px 8px; border-radius: 999px;
  font-size: .68rem; font-weight: 700;
}
.pill.done { color: var(--done); background: color-mix(in srgb, var(--done) 16%, transparent); }
.pill.miss { color: var(--miss); background: color-mix(in srgb, var(--miss) 16%, transparent); }
.empty { padding: 30px; text-align: center; color: var(--ink-muted); font-size: .88rem; }
.record-toggle, .record-action { display: none; }
@media (max-width: 760px) {
  .tablewrap { border: 0; background: transparent; box-shadow: none; overflow: visible; }
  table { display: block; }
  thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  tbody { display: flex; flex-direction: column; gap: 12px; }
  tbody tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; padding: 14px;
    border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); }
  tbody td { display: block; border: 0; padding: 4px 0; white-space: normal; overflow-wrap: anywhere; min-width: 0; }
  td.record-title { grid-column: 1 / -1; grid-row: 1; font-weight: 650; font-size: 15px; }
  td.record-date { grid-row: 2; font-size: 13px; color: var(--ink-muted); }
  td.record-state { grid-row: 2; text-align: right; }
  td.record-details { grid-column: 1 / -1; }
  tr:not(.expanded) td.record-details { display: none; }
  td.record-details:empty { display: none; }
  td.record-details::before { content: attr(data-label); display: block; color: var(--ink-muted); font: 11px/1.5 system-ui, sans-serif; }
  td.record-action { display: block; grid-column: 1 / -1; padding-top: 8px; }
  td.empty { grid-column: 1 / -1; }
  .record-toggle { display: inline-flex; align-items: center; justify-content: center;
    width: 100%; border: 1px solid var(--rule); border-radius: 7px;
    background: var(--surface-2); color: var(--ink); font: inherit; }
  td.notes { max-width: 100%; }
  .bar label:has(input[type=checkbox]) { min-height: 44px; }
  html body .pager { display: grid; grid-template-columns: 44px 44px minmax(0, 1fr) 44px 44px; gap: 4px; }
  html body .pager button { padding: 0; }
  .pager-word { display: none; }
  .pager .count { font-size: 11px; text-align: center; margin: 0; }
  .pagination-top { position: sticky; top: var(--mobile-nav-height); z-index: 5; }
  .tablewrap { scroll-margin-top: calc(var(--mobile-nav-height) + 78px); }
}
</style>

<div class="wrap">

  <p class="eyebrow">Stellar</p>
  <h1>Activity</h1>
  <p class="sub">Every stored record, newest first.</p>

  <div class="bar">
    <input type="search" id="q" placeholder="Filter by task, note or date…" aria-label="Filter">
    <select id="status" aria-label="Status">
      <option value="">All</option>
      <option value="done">Completed</option>
      <option value="incomplete">Incomplete</option>
      <option value="unreported">Unreported</option>
    </select>
    <select id="size" aria-label="Rows per page">
      <option>20</option><option selected>50</option><option>100</option><option>200</option>
    </select>
    <label style="font-size:.8rem;color:var(--ink-muted);display:flex;gap:6px;align-items:center">
      <input type="checkbox" id="future"> show future
    </label>
    <span class="count mono" id="count"></span>
  </div>

  <div class="bar pagination-top"><div class="pager">
    <button type="button" data-page-action="first" aria-label="First page">&laquo;<span class="pager-word"> First</span></button>
    <button type="button" data-page-action="prev" aria-label="Previous page">&lsaquo;<span class="pager-word"> Prev</span></button>
    <span class="count mono page-counter"></span>
    <button type="button" data-page-action="next" aria-label="Next page"><span class="pager-word">Next </span>&rsaquo;</button>
    <button type="button" data-page-action="last" aria-label="Last page"><span class="pager-word">Last </span>&raquo;</button>
  </div></div>

  <div class="tablewrap">
    <table role="table" aria-label="Task records">
      <thead><tr>
        <th>Date</th><th>Task</th><th>List</th><th>Status</th>
        <th>Weight</th><th>Source</th><th>Completed</th><th>Notes</th><th class="record-toggle">Details</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="bar" style="margin-top:12px">
    <div class="pager">
      <button id="first" type="button" data-page-action="first" aria-label="First page">&laquo;<span class="pager-word"> First</span></button>
      <button id="prev" type="button" data-page-action="prev" aria-label="Previous page">&lsaquo;<span class="pager-word"> Prev</span></button>
      <span class="count mono page-counter" id="page"></span>
      <button id="next" type="button" data-page-action="next" aria-label="Next page"><span class="pager-word">Next </span>&rsaquo;</button>
      <button id="last" type="button" data-page-action="last" aria-label="Last page"><span class="pager-word">Last </span>&raquo;</button>
    </div>
  </div>
</div>

<script id="bootstrap" type="application/json">__BOOTSTRAP__</script>
<script>
(function () {
  var BOOT = JSON.parse(document.getElementById('bootstrap').textContent);
  var ALL = [], view = [], page = 0;
  if (matchMedia('(max-width: 760px)').matches) document.getElementById('size').value = '20';

  /* Days are materialised ahead of time, so the table would otherwise open on a
     wall of empty placeholder rows months out. Hide anything past today unless
     asked; local parts, not UTC, or the current day disappears each evening. */
  var now = new Date();
  var TODAY = now.getFullYear() + '-' +
    String(now.getMonth() + 1).padStart(2, '0') + '-' +
    String(now.getDate()).padStart(2, '0');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function size() { return Number(document.getElementById('size').value); }

  function applyFilters(keepPage) {
    var q = document.getElementById('q').value.trim().toLowerCase();
    var st = document.getElementById('status').value;
    var showFuture = document.getElementById('future').checked;
    view = ALL.filter(function (r) {
      if (!showFuture && r.day > TODAY) return false;
      if (st && StellarReports.state(r) !== st) return false;
      if (!q) return true;
      return (r.day + ' ' + r.title + ' ' + (r.list_title || '') + ' ' +
              (r.notes || '')).toLowerCase().indexOf(q) !== -1;
    });
    if (!keepPage) page = 0;
    render();
  }

  function render() {
    var n = size();
    var pages = Math.max(1, Math.ceil(view.length / n));
    page = Math.min(Math.max(0, page), pages - 1);
    var slice = view.slice(page * n, page * n + n);

    document.getElementById('rows').innerHTML = slice.length
      ? slice.map(function (r) {
          var w = r.weight_lbs === null || r.weight_lbs === undefined
            ? '' : Number(r.weight_lbs).toFixed(1);
          return '<tr>' +
            '<td class="mono record-date">' + esc(r.day) + '</td>' +
            '<td class="record-title">' + esc(r.title) + '</td>' +
            '<td class="record-details" data-label="List">' + esc(r.list_title || '') + '</td>' +
            '<td class="record-state"><span class="pill ' + StellarReports.state(r) + '">' + StellarReports.labels[StellarReports.state(r)] + '</span></td>' +
            '<td class="mono record-details" data-label="Weight">' + w + '</td>' +
            '<td class="mono record-details" data-label="Source">' + esc(r.weight_source || '') + '</td>' +
            '<td class="mono record-details" data-label="Completed">' + esc((r.completed_at || '').replace('T', ' ').slice(0, 16)) + '</td>' +
            '<td class="notes record-details" data-label="Notes">' + esc(r.notes || '') + '</td>' +
            '<td class="record-action"><button type="button" class="record-toggle" aria-expanded="false">Show details</button></td>' +
          '</tr>';
        }).join('')
      : '<tr><td colspan="8" class="empty">Nothing matches that filter.</td></tr>';

    document.getElementById('count').textContent =
      view.length.toLocaleString() + ' of ' + ALL.length.toLocaleString() + ' rows';
    document.querySelectorAll('.page-counter').forEach(function (el) { el.textContent = (page + 1) + ' / ' + pages; });
    document.querySelectorAll('[data-page-action]').forEach(function (button) {
      var first = button.dataset.pageAction === 'first' || button.dataset.pageAction === 'prev';
      button.disabled = first ? page === 0 : page >= pages - 1;
    });
  }

  ['q', 'status', 'size', 'future'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', function () { applyFilters(); });
  });
  document.getElementById('rows').addEventListener('click', function (e) {
    var button = e.target.closest('.record-toggle');
    if (!button) return;
    var open = button.closest('tr').classList.toggle('expanded');
    button.setAttribute('aria-expanded', String(open));
    button.textContent = open ? 'Hide details' : 'Show details';
  });
  document.addEventListener('click', function (e) {
    var button = e.target.closest('[data-page-action]');
    if (!button) return;
    var action = button.dataset.pageAction;
    page = action === 'first' ? 0 : action === 'last' ? Math.ceil(view.length / size()) - 1
      : page + (action === 'prev' ? -1 : 1);
    render();
    if (matchMedia('(max-width: 760px)').matches) document.querySelector('.tablewrap').scrollIntoView({ block: 'start' });
  });

  var loaded = false, loading = false, dirty = false, checked = 0;
  function load() {
    if (!window.stellarPageActive() || loading || loaded && !dirty && Date.now() - checked < 60000) return;
    loading = true; dirty = false;
    (BOOT.mode === 'live'
      ? fetch(BOOT.endpoint, { headers: BOOT.headers || {}, cache: 'no-store' }).then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
      : Promise.resolve(BOOT.data))
      .then(function (data) {
        ALL = data.slice().sort(function (a, b) {
          return a.day < b.day ? 1 : a.day > b.day ? -1 : a.title.localeCompare(b.title);
        });
        applyFilters(loaded); loaded = true; checked = Date.now();
      }).catch(function (e) {
        dirty = true;
        if (!loaded) document.getElementById('rows').innerHTML =
          '<tr><td colspan="8" class="empty">Could not load: ' + esc(e.message) + '</td></tr>';
      }).finally(function () { loading = false; });
  }
  function changed() { dirty = true; load(); }
  window.addEventListener('stellar:records-changed', changed);
  window.addEventListener('storage', function (event) { if (event.key === 'stellar:records-changed') changed(); });
  window.addEventListener('stellar:report-clock', function () { TODAY = StellarReports.today(); if (loaded) applyFilters(true); });
  window.addEventListener('stellar:visibility', load);
  document.addEventListener('visibilitychange', load);
  window.addEventListener('focus', load);
  setInterval(load, 60000);
  load();
})();
</script>
