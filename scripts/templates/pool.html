<title>Pool · Stellar</title>
<style>
/* Pool colours live on .sky so the shared sidebar retains its theme. Star
   artwork pulses independently while labels, hit targets and links stay put.
   The far sky is cached; only nearby specks redraw, at a limited frame rate.
   Motion pauses offscreen and respects the system's reduced-motion setting.
   Dragging only moves stars; prerequisites are chosen explicitly in task
   details. Redraws wait for a held star. Position writes run in order for each
   star, and local positions survive refreshes until the database confirms them.
   Failed saves stay visible and retry on the next refresh. Drops use the release
   coordinates even if move events were skipped; browser interruptions keep the
   last dragged position. Escape explicitly restores the starting position. */
.sky {
  --void: #04050A;
  --star: #FFFCF4;
  --ink-sky: rgba(228,224,242,.74);
  --ink-faint: rgba(150,146,185,.55);
  --line: rgba(214,222,255,.17);
  --line-live: rgba(196,178,255,.55);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #04050A; color: rgba(228,224,242,.74);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }

/* The pool owns the whole field, so the page furniture the other views use --
   a centred column, a card, a heading -- would only get in the way of it. */
.sky {
  position: fixed; inset: 0 0 0 var(--nav-w); overflow: hidden;
  background:
    radial-gradient(1400px 900px at 78% 8%,  rgba(70,84,150,.16), transparent 62%),
    radial-gradient(1100px 800px at 12% 92%, rgba(120,80,190,.10), transparent 62%),
    radial-gradient(700px 500px at 45% 55%,  rgba(180,150,255,.045), transparent 70%),
    var(--void);
}
@media (max-width: 760px) { .sky { inset: 0; } }
.sky canvas, .sky svg { position: absolute; inset: 0; }
.sky #dust { width: 100%; height: 100%; pointer-events: none; }
.pool-loading { position: absolute; inset: 0; z-index: 5; color: #c4c0d6; pointer-events: none; }
.pool-loading button { pointer-events: auto; min-height: 44px; padding: 8px 18px; border: 1px solid var(--line);
  border-radius: 8px; background: #10111e; color: #eee; font: inherit; cursor: pointer; }
.sky[data-loading=true] :is(.pool-toolbar,.pool-map,.pool-list,.key) { visibility: hidden; pointer-events: none; }
body[data-workspace-overlay=true] .sky .pool-loading { left: var(--workspace-inset); }
.sky svg { pointer-events: none; }

.star { position: absolute; transform: translate(-50%, -50%); cursor: grab; touch-action: none; }
.star:focus-visible .hit { outline: 2px solid var(--line-live); outline-offset: 2px; }
.star.held { cursor: grabbing; }
.star:not(.ghost,.ember) .star-glow {
  transform-box: fill-box; transform-origin: center;
  animation: star-bloom var(--glow-period) ease-in-out var(--glow-phase) infinite;
}
.star:not(.ghost,.ember) .star-core {
  animation: star-shimmer var(--core-period) ease-in-out var(--core-phase) infinite;
}
.star:is(:hover,:focus-visible,.held) :is(.star-glow,.star-core),
.sky[data-motion-paused=true] :is(.star-glow,.star-core) { animation-play-state: paused; }
@keyframes star-bloom {
  0%, 100% { opacity: var(--star-low); transform: scale(.96); }
  50% { opacity: 1; transform: scale(var(--star-bloom)); }
}
@keyframes star-shimmer {
  0%, 100% { opacity: .76; }
  50% { opacity: 1; }
}
/* Generous, and deliberately so. Empty sky now creates a star, which only
   works if hitting a star is easy -- the two changes hold each other up. */
.star .hit {
  position: absolute; left: 50%; top: 50%; width: 66px; height: 66px;
  transform: translate(-50%, -50%); border-radius: 50%;
}
/* Annotated the way a chart annotates a star -- offset, small, tracked --
   rather than centred underneath the way a graph names a node. Uppercase
   because it has to read as a label and not as a proper noun, and because it
   is the type the rest of the app already uses for labels. */
.star .name {
  position: absolute; left: 15px; bottom: 9px; white-space: nowrap;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 9.5px; letter-spacing: .19em; text-transform: uppercase;
  color: var(--ink-sky); text-shadow: 0 1px 8px var(--void), 0 0 3px var(--void);
  user-select: none;                 /* clickable: it is half the target */
}
.star .waiting {
  position: absolute; left: 15px; bottom: -4px; white-space: nowrap;
  font-family: ui-monospace, Menlo, monospace; font-size: 8.5px;
  letter-spacing: .16em; color: rgba(150,146,180,.42);
  pointer-events: none; user-select: none;
}
.star.dim .name { color: rgba(190,186,214,.34); }
/* After .dim, so it wins on source order where the two would otherwise tie. */
.star.flip .name, .star.flip .waiting { left: auto; right: 15px; text-align: right; }

.hud {
  position: absolute; left: 26px; top: 20px; z-index: 3;
  font-family: ui-monospace, Menlo, monospace; font-size: 10px;
  letter-spacing: .22em; text-transform: uppercase; color: var(--ink-faint);
}
.key {
  position: absolute; left: 26px; bottom: 20px; z-index: 3; line-height: 1.9;
  font-family: ui-monospace, Menlo, monospace; font-size: 9.5px;
  letter-spacing: .13em; color: rgba(120,116,150,.5);
}
#note {
  position: absolute; left: 26px; top: 44px; z-index: 3; min-height: 1.2em;
  font-family: ui-monospace, Menlo, monospace; font-size: 10px;
  letter-spacing: .1em; color: rgba(196,178,255,.8);
}
#note.bad { color: #E3806B; }

.new {
  position: absolute; right: 26px; top: 18px; z-index: 3; display: flex; gap: 8px;
}
.new input {
  width: 232px; font: inherit; font-size: .82rem; padding: 8px 11px;
  border-radius: 8px; border: 1px solid rgba(150,146,200,.28);
  background: rgba(255,255,255,.04); color: var(--ink-sky);
  font-family: ui-monospace, Menlo, monospace;
}
.new input::placeholder { color: rgba(150,146,185,.45); }
.new input:focus { outline: none; border-color: var(--line-live); }
.new button { min-height: 44px; padding: 8px 14px; border: 1px solid rgba(150,146,200,.3);
  border-radius: 8px; background: #29203f; color: #efeaff; font: inherit; cursor: pointer; }
.pool-map { position: absolute; inset: 0; overflow: hidden; }
.pool-view, .pool-list { display: none; }
.key summary { display: inline-flex; align-items: center; min-height: 44px; cursor: pointer;
  padding: 4px 10px; border: 1px solid var(--line); border-radius: 7px; color: #c4c0d6;
  background: #10111e; letter-spacing: .04em; }
.key p { margin: 6px 0 0; padding: 10px; background: #10111e; color: #c4c0d6; letter-spacing: .04em; }
@media (max-width: 760px) { .new { right: 14px; } .new input { width: 150px; } }

/* An ember: what is left where a resolved star was. Visible only while
   `show resolved` is on, and never gating anything. Title hidden until
   hovered — a resolved star earned its quiet. */
.star.ember { opacity: .45; }
.star.ember .name { color: rgba(150,146,185,.30); opacity: 0; transition: opacity .2s; }
.star.ember:hover .name { opacity: 1; }
.star.ember .resolvedwhen {
  position: absolute; left: 15px; bottom: -4px; white-space: nowrap;
  font-family: ui-monospace, Menlo, monospace; font-size: 8.5px;
  letter-spacing: .16em; color: rgba(130,126,165,.34);
  pointer-events: none; user-select: none;
  opacity: 0; transition: opacity .2s;
}
.star.ember:hover .resolvedwhen { opacity: 1; }
.star.flip .resolvedwhen { left: auto; right: 15px; text-align: right; }

.toggle {
  margin-left: 18px; cursor: pointer; user-select: none;
  color: rgba(140,136,180,.5); border-bottom: 1px dotted rgba(140,136,180,.3);
  min-height: 44px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px;
  background: #10111e; font: inherit; letter-spacing: .04em;
}
.toggle.on { color: rgba(196,178,255,.85); border-bottom-color: rgba(196,178,255,.5); }

/* The panel. Anchored to its star rather than parked at a screen edge, so the
   thing being described stays next to the description. */
#panel {
  position: absolute; z-index: 6; width: 268px; display: none;
  background: rgba(10,11,20,.94); border: 1px solid rgba(150,146,200,.22);
  border-radius: 10px; padding: 13px 14px 12px;
  box-shadow: 0 18px 44px rgba(0,0,0,.6);
  backdrop-filter: blur(3px);
}
#panel.open { display: block; }
#panel .ptitle {
  font-family: ui-monospace, Menlo, monospace; font-size: 10px;
  letter-spacing: .17em; text-transform: uppercase;
  color: var(--ink-sky); margin-bottom: 3px; word-break: break-word;
}
#panel .pmeta {
  font-family: ui-monospace, Menlo, monospace; font-size: 8.5px;
  letter-spacing: .12em; color: rgba(140,136,180,.6); margin-bottom: 10px;
}
#panel textarea {
  width: 100%; min-height: 62px; resize: vertical; font: inherit;
  font-size: .78rem; line-height: 1.5; padding: 8px 9px; border-radius: 7px;
  border: 1px solid rgba(150,146,200,.2); background: rgba(255,255,255,.035);
  color: var(--ink-sky); font-family: system-ui, -apple-system, sans-serif;
}
#panel textarea::placeholder { color: rgba(150,146,185,.35); }
#panel textarea:focus { outline: none; border-color: var(--line-live); }
#panel .waits { margin-top: 10px; }
#panel .waits h4 {
  margin: 0 0 5px; font-family: ui-monospace, Menlo, monospace;
  font-size: 8.5px; letter-spacing: .16em; text-transform: uppercase;
  font-weight: 400; color: rgba(140,136,180,.6);
}
#panel .waits div {
  display: flex; align-items: center; gap: 8px; padding: 3px 0;
  font-size: .76rem; color: rgba(214,210,235,.8);
}
#panel .waits button {
  margin-left: auto; border: none; background: none; cursor: pointer;
  color: rgba(150,146,185,.6); font-size: .9rem; line-height: 1; padding: 2px 4px;
}
#panel .waits button:hover { color: #E3806B; }
#panel .link-picker { margin-top: 12px; font-size: 13px; }
#panel .link-picker summary { min-height: 44px; display: flex; align-items: center;
  cursor: pointer; color: var(--ink-sky); }
#panel .link-picker summary::before { content: '+'; margin-right: 8px; }
#panel .link-picker summary::-webkit-details-marker { display: none; }
#panel .link-picker[open] summary::before { content: '−'; }
#panel .link-picker label { display: block; color: var(--ink-sky); margin: 2px 0 8px; line-height: 1.5; }
#panel .link-picker select { width: 100%; min-width: 0; min-height: 44px; padding: 8px;
  border: 1px solid var(--line); border-radius: 7px; background: #10111e;
  color: var(--ink-sky); font: 16px/1.5 system-ui, sans-serif; }
#panel .link-actions { display: flex; gap: 8px; margin-top: 8px; }
#panel .link-actions button { flex: 1; min-height: 44px; padding: 8px;
  border: 1px solid var(--line); border-radius: 7px; background: #10111e;
  color: var(--ink-sky); font: 13px/1.5 system-ui, sans-serif; cursor: pointer; }
#panel .link-picker :is(summary,select,button):focus-visible { outline: 2px solid var(--line-live); outline-offset: 2px; }
#panel .acts { display: flex; gap: 8px; margin-top: 12px; }
#panel .acts button {
  flex: 1; font: inherit; font-size: .78rem; padding: 8px 10px; cursor: pointer;
  border-radius: 7px; border: 1px solid rgba(150,146,200,.24);
  background: rgba(255,255,255,.04); color: var(--ink-sky);
}
#panel .acts button.primary {
  background: rgba(122,79,216,.30); border-color: rgba(160,130,240,.45);
  color: #EFEAFF; font-weight: 600;
}
#panel .acts button:hover { border-color: var(--line-live); }
/* Deliberately not in the button row. Resolve and Delete sitting shoulder to
   shoulder is how a mis-tap becomes an unrecoverable one. */
#panel .danger {
  display: block; width: 100%; margin-top: 9px; padding: 5px 0;
  border: none; background: none; cursor: pointer; text-align: center;
  font-family: ui-monospace, Menlo, monospace; font-size: 8.5px;
  letter-spacing: .17em; text-transform: uppercase; color: rgba(150,146,185,.45);
}
#panel .danger:hover { color: #E3806B; }

#veil {
  position: absolute; inset: 0; z-index: 8; display: none;
  background: rgba(4,5,10,.72); backdrop-filter: blur(2px);
  align-items: center; justify-content: center;
}
#veil.open { display: flex; }
#veil .box {
  width: 330px; max-width: calc(100% - 32px);
  background: rgba(12,13,22,.97); border: 1px solid rgba(196,120,110,.34);
  border-radius: 11px; padding: 18px 18px 15px;
  box-shadow: 0 24px 60px rgba(0,0,0,.7);
}
#veil h3 {
  margin: 0 0 8px; font-family: ui-monospace, Menlo, monospace;
  font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
  font-weight: 400; color: #E3806B;
}
#veil p { margin: 0 0 6px; font-size: .82rem; line-height: 1.55; color: var(--ink-sky); }
#veil .loses {
  margin: 8px 0 0; font-family: ui-monospace, Menlo, monospace; font-size: .72rem;
  line-height: 1.7; color: rgba(150,146,185,.7);
}
#veil .vacts { display: flex; gap: 9px; margin-top: 16px; }
#veil .vacts button {
  flex: 1; font: inherit; font-size: .8rem; padding: 9px 10px; cursor: pointer;
  border-radius: 7px; border: 1px solid rgba(150,146,200,.24);
  background: rgba(255,255,255,.04); color: var(--ink-sky);
}
#veil .vacts button.wreck {
  background: rgba(190,72,56,.28); border-color: rgba(226,120,104,.5);
  color: #FFD9D1; font-weight: 600;
}
#veil .vacts button:focus-visible { outline: 2px solid var(--line-live); outline-offset: 1px; }

/* A star being named. It exists on screen and nowhere else -- nothing is
   written until it has a name, so a stray click costs nothing. */
.star.ghost { cursor: default; }
.star.ghost input {
  position: absolute; left: 15px; bottom: 4px; width: 178px;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 9.5px; letter-spacing: .19em; text-transform: uppercase;
  color: var(--star); background: rgba(255,255,255,.05);
  border: none; border-bottom: 1px solid var(--line-live);
  padding: 3px 4px; outline: none;
}
.star.ghost.flip input { left: auto; right: 15px; text-align: right; }
.star.ghost input::placeholder { color: rgba(150,146,185,.4); letter-spacing: .14em; }
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
  .star-glow, .star-core { animation: none !important; }
}
</style>

<div class="sky" id="sky" data-view="list" data-loading="true">
  <canvas id="dust"></canvas>
  <div id="pool-loading" class="pool-loading stellar-loading" role="status">
    <span class="stellar-spinner" aria-hidden="true"></span><span id="pool-load-status">Loading Pool…</span>
    <button type="button" id="pool-retry" hidden>Retry</button>
  </div>
  <div class="pool-map" id="pool-map">
  <svg id="lines"></svg>
  </div>
  <div class="pool-toolbar">
  <div class="hud" id="hud">Pool</div>
  <div id="note" role="status" aria-live="polite"></div>
  <form class="new" id="pool-add">
    <input id="add" type="text" placeholder="Name a task" maxlength="200" enterkeyhint="done"
           aria-label="Add a task to the pool">
    <button type="submit">Add</button>
  </form>
  <div class="pool-view" role="group" aria-label="Pool view">
    <button type="button" data-pool-view="list" aria-pressed="true">List</button>
    <button type="button" data-pool-view="map" aria-pressed="false">Map</button>
  </div>
  </div>
  <ul class="pool-list" id="pool-list" aria-label="Pool tasks"></ul>
  <div id="panel" role="dialog" aria-labelledby="pool-title"></div>
  <div id="veil"><div class="box" role="alertdialog" aria-modal="true"
       aria-labelledby="veilh"></div></div>
  <details class="key"><summary>How to use the pool</summary>
    <p>Select a star to edit it, or drag to move it. In task details, choose Add
    prerequisite to make it wait on another task. Select empty sky to add a task
    there. Press Escape to cancel a drag or close task details.</p>
  </details>
</div>

<script id="bootstrap" type="application/json">__BOOTSTRAP__</script>
<script>
(function () {
  var BOOT = JSON.parse(document.getElementById('bootstrap').textContent);
  var TASKS = BOOT.tasks || [];
  var EDGES = BOOT.edges || [];
  var requestedStar = new URLSearchParams(location.search).get('star');

  var sky = document.getElementById('sky');
  var mapField = document.getElementById('pool-map');
  var poolList = document.getElementById('pool-list');
  var svg = document.getElementById('lines');
  var noteEl = document.getElementById('note');
  var panelEl = document.getElementById('panel');
  var veil = document.getElementById('veil');
  var W = 0, H = 0;
  var writesInFlight = 0;
  var poolRevision = 0;
  var positions = Object.create(null);
  var paintPending = false;
  var embeddedVisible = true;
  var poolLoaded = !BOOT.loading;
  var poolLoading = document.getElementById('pool-loading');
  var poolRetry = document.getElementById('pool-retry');
  sky.dataset.loading = String(!poolLoaded); poolLoading.hidden = poolLoaded;
  var viewKey = 'stellar:pool-view:' + (BOOT.embedded ? 'workspace' : 'standalone');
  try {
    var rememberedView = localStorage.getItem(viewKey);
    if (rememberedView === 'list' || rememberedView === 'map') sky.dataset.view = rememberedView;
  } catch (e) {}
  if (BOOT.embedded) {
    if (!rememberedView) sky.dataset.view = 'map';
    window.addEventListener('message', function (event) {
      if (event.origin !== location.origin || event.source !== parent ||
          !event.data || event.data.type !== 'stellar:pool-visibility') return;
      var wasVisible = embeddedVisible;
      embeddedVisible = event.data.visible === true;
      if (!embeddedVisible) finishDrag(false);
      var inset = Math.max(0, Math.min(Number(event.data.inset) || 0, innerWidth - 300));
      document.body.dataset.workspaceOverlay = String(inset > 0);
      sky.style.setProperty('--workspace-inset', inset + 'px');
      syncMotion();
      if (embeddedVisible) { scheduleResize(); if (!wasVisible) pollPool(); }
    });
  }
  document.querySelectorAll('[data-pool-view]').forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.dataset.poolView === sky.dataset.view));
  });

  function note(msg, bad) {
    noteEl.textContent = msg || '';
    noteEl.className = bad ? 'bad' : '';
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function post(url, method, body) {
    poolRevision++;
    writesInFlight++;
    var options = { method: method || 'POST' };
    if (body !== undefined) { options.headers = { 'Content-Type': 'application/json' }; options.body = JSON.stringify(body); }
    return fetch(url, options).then(function (res) {
      if (res.ok) return res.json();
      return res.json().catch(function () { return {}; }).then(function (j) {
        throw new Error(j.detail || ('HTTP ' + res.status));
      });
    }).then(function (value) {
      writesInFlight--;
      return value;
    }, function (err) {
      writesInFlight--;
      throw err;
    });
  }

  /* ---- the field ------------------------------------------------------- */
  var dust = document.getElementById('dust'), g = dust.getContext('2d');
  var dustBase = document.createElement('canvas'), dustContext = dustBase.getContext('2d');
  var dustStars = [], dustWidth = 0, dustHeight = 0, dustFrame = 0, dustLast = 0;
  var reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

  function motionActive() { return window.stellarPageActive() && embeddedVisible && !reducedMotion.matches; }
  function renderDust(time) {
    if (!dustWidth || !dustHeight) return;
    g.clearRect(0, 0, dustWidth, dustHeight);
    g.drawImage(dustBase, 0, 0, dustWidth, dustHeight);
    dustStars.forEach(function (s) {
      var alpha = s.alpha * (reducedMotion.matches ? 1 : .78 + .22 * Math.sin(time * s.speed + s.phase));
      g.beginPath();
      g.arc(s.x * dustWidth, s.y * dustHeight, s.radius, 0, 6.283);
      g.fillStyle = 'rgba(232,236,255,' + alpha.toFixed(3) + ')';
      g.fill();
    });
  }
  function tickDust(time) {
    dustFrame = 0;
    if (!motionActive()) return;
    if (time - dustLast >= 80) { renderDust(time); dustLast = time; }
    dustFrame = requestAnimationFrame(tickDust);
  }
  function syncMotion() {
    if (dustFrame) cancelAnimationFrame(dustFrame);
    dustFrame = 0;
    sky.dataset.motionPaused = String(!motionActive());
    if (motionActive()) dustFrame = requestAnimationFrame(tickDust);
    else if (dustWidth && reducedMotion.matches) renderDust(0);
  }
  reducedMotion.addEventListener('change', syncMotion);
  document.addEventListener('visibilitychange', syncMotion);
  window.addEventListener('stellar:visibility', function () { syncMotion(); if (window.stellarPageActive()) { scheduleResize(); pollPool(); } else finishDrag(false); });
  window.addEventListener('pagehide', function () {
    if (dustFrame) cancelAnimationFrame(dustFrame);
    dustFrame = 0;
  });
  window.addEventListener('pageshow', syncMotion);

  /* Three layers rather than one field of identical specks: the far layer
     dense and nearly invisible, the near layer sparse and brighter. That
     difference is what reads as depth. Seeded, so the sky does not reshuffle
     itself on every resize. */
  function drawDust() {
    var dpr = window.devicePixelRatio || 1;
    var width = sky.clientWidth, height = sky.clientHeight;
    dustWidth = width; dustHeight = height; dustStars = [];
    dust.width = width * dpr; dust.height = height * dpr;
    dustBase.width = dust.width; dustBase.height = dust.height;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    dustContext.setTransform(dpr, 0, 0, dpr, 0, 0);
    var seed = 21;
    function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
    [[900, .34, .45], [320, .55, .8], [90, .8, 1.35]].forEach(function (L) {
      for (var i = 0; i < L[0]; i++) {
        var a = rnd() * L[1] + .04, r = rnd() * L[2] + .16;
        var x = rnd(), y = rnd();
        if (L[0] === 90) {
          dustStars.push({ x: x, y: y, radius: r, alpha: a,
            speed: 6.283 / (3500 + rnd() * 7000), phase: rnd() * 6.283 });
        } else {
          dustContext.beginPath();
          dustContext.arc(x * width, y * height, r, 0, 6.283);
          dustContext.fillStyle = 'rgba(232,236,255,' + a.toFixed(3) + ')';
          dustContext.fill();
        }
      }
    });
    renderDust(performance.now());
    syncMotion();
  }

  /* ---- model ----------------------------------------------------------- */
  var byId = {};
  function reindex() {
    byId = {};
    TASKS.forEach(function (t) { byId[t.id] = t; });
  }
  var SHOW_RESOLVED = false;
  var PENDING = null;                 // a star being named, not yet saved
  function isOpen(t) { return t && !t.resolved_at; }
  function visible() {
    return SHOW_RESOLVED ? TASKS : TASKS.filter(isOpen);
  }

  /* ---- naming a new star ------------------------------------------------
     It appears where you clicked and takes a name in place. Nothing reaches
     the database until it has one, so a stray click on empty sky costs a
     keystroke rather than a row to clean up. */
  function beginNewStar(fx, fy) {
    if (PENDING) return;
    PENDING = { id: '__new__', title: '', notes: null, x: fx, y: fy,
                created_at: null, resolved_at: null, pending: true };
    TASKS.push(PENDING);
    closePanel();
    paint();
    var box = sky.querySelector('.star.ghost input');
    if (box) box.focus();
  }

  function dropNewStar() {
    if (!PENDING) return;
    var p = PENDING;
    PENDING = null;
    TASKS = TASKS.filter(function (x) { return x !== p; });
    paint();
  }

  function commitNewStar(title) {
    var p = PENDING;
    if (!p) return;
    title = (title || '').trim();
    if (!title) { dropNewStar(); return; }
    PENDING = null;                   // stop a second commit from the blur
    post('/api/pool/task?title=' + encodeURIComponent(title) +
         '&x=' + p.x.toFixed(4) + '&y=' + p.y.toFixed(4))
      .then(function (row) {
        row.x = Number(row.x); row.y = Number(row.y);
        TASKS = TASKS.filter(function (x) { return x !== p; });
        TASKS.push(row);
        note(row.title + ' added · reminder in 24 hours');
        paint();
      })
      .catch(function (err) {
        note(err.message, true);
        TASKS = TASKS.filter(function (x) { return x !== p; });
        paint();
      });
  }
  /* Only prerequisites that are still open. With `show resolved` on, byId also
     holds resolved stars, and a resolved prerequisite is a satisfied one -- it
     must not gate, or turning the toggle on would dim half the sky. */
  function prereqsOf(id) {
    return EDGES.filter(function (e) { return e.after_id === id; })
                .map(function (e) { return e.before_id; })
                .filter(function (b) { return isOpen(byId[b]); });
  }
  /* Magnitude carries age: the longer something has sat in the pool unresolved,
     the brighter it burns. It is the one property worth encoding, and it costs
     nothing to read. */
  function magnitude(t) {
    if (!t.created_at) return 1.4;
    var days = (Date.now() - Date.parse(t.created_at)) / 86400000;
    if (!isFinite(days) || days < 0) days = 0;
    return 1.0 + Math.min(days / 45, 1) * 1.5;
  }

  /* ---- painting -------------------------------------------------------- */
  function starSVG(id, m) {
    var core = 1.5 + m * 1.15, bloom = 7 + m * 7, spike = 9 + m * 9;
    var s = '<svg width="90" height="90" viewBox="-45 -45 90 90" ' +
      'style="display:block;transform:translate(-45px,-45px);pointer-events:none">';
    s += '<defs><radialGradient id="bl' + id + '">' +
         '<stop offset="0%" stop-color="rgba(255,252,245,.85)"/>' +
         '<stop offset="38%" stop-color="rgba(206,214,255,.20)"/>' +
         '<stop offset="100%" stop-color="rgba(150,170,255,0)"/>' +
         '</radialGradient></defs>';
    s += '<g class="star-glow"><circle cx="0" cy="0" r="' + bloom + '" fill="url(#bl' + id + ')"/>';
    if (m > 1.4) {
      s += '<path d="M' + -spike + ' 0 H' + spike + ' M0 ' + -spike + ' V' + spike +
           '" stroke="rgba(255,250,240,' + (0.10 + m * 0.055).toFixed(2) +
           ')" stroke-width="0.8" stroke-linecap="round"/>';
    }
    s += '</g><circle class="star-core" cx="0" cy="0" r="' + core.toFixed(2) + '" fill="var(--star)"/></svg>';
    return s;
  }

  function unlitSVG() {
    return '<svg width="26" height="26" viewBox="0 0 26 26" ' +
      'style="display:block;transform:translate(-13px,-13px);pointer-events:none">' +
      '<circle class="star-core" cx="13" cy="13" r="4.2" fill="none" ' +
      'stroke="rgba(196,200,235,.42)" stroke-width="0.9"/></svg>';
  }

  /* An ember. Dimmer than an unlit star and filled rather than outlined, so the
     two never read as the same state: unlit means not yet, ember means done. */
  function emberSVG() {
    return '<svg width="26" height="26" viewBox="0 0 26 26" ' +
      'style="display:block;transform:translate(-13px,-13px);pointer-events:none">' +
      '<circle cx="13" cy="13" r="2.6" fill="rgba(176,166,214,.30)"/></svg>';
  }

  function setStarMotion(el, id) {
    var seed = 2166136261;
    String(id).split('').forEach(function (c) { seed = Math.imul(seed ^ c.charCodeAt(0), 16777619) >>> 0; });
    function rnd() { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; }
    var glow = 4 + rnd() * 5, core = 3 + rnd() * 4, now = performance.now() / 1000;
    el.style.setProperty('--glow-period', glow.toFixed(3) + 's');
    el.style.setProperty('--core-period', core.toFixed(3) + 's');
    el.style.setProperty('--glow-phase', -((now + rnd() * glow) % glow).toFixed(3) + 's');
    el.style.setProperty('--core-phase', -((now + rnd() * core) % core).toFixed(3) + 's');
    el.style.setProperty('--star-low', (.58 + rnd() * .2).toFixed(3));
    el.style.setProperty('--star-bloom', (1.04 + rnd() * .1).toFixed(3));
  }

  function paint() {
    if (drag) { paintPending = true; return; }
    paintPending = false;
    reindex();
    Array.prototype.forEach.call(sky.querySelectorAll('.star'), function (n) { n.remove(); });

    visible().forEach(function (t) {
      if (t.pending) {
        var ghost = document.createElement('div');
        ghost.className = 'star ghost' + (t.x > .5 ? ' flip' : '');
        var pendingPoint = screenPoint(t);
        ghost.style.left = pendingPoint.x + 'px';
        ghost.style.top = pendingPoint.y + 'px';
        ghost.innerHTML = starSVG('new', 1.2) +
          '<input maxlength="200" placeholder="name it" aria-label="Name this star">';
        mapField.appendChild(ghost);
        var box = ghost.querySelector('input');
        box.style.width = Math.max(60, Math.min(178, (t.x > .5 ? pendingPoint.x : W - pendingPoint.x) - 28)) + 'px';
        box.style.bottom = Math.min(4, pendingPoint.y - 52) + 'px';
        box.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); commitNewStar(box.value); }
          else if (e.key === 'Escape') { e.preventDefault(); dropNewStar(); }
          e.stopPropagation();          // Escape here is not "close the panel"
        });
        /* Clicking away keeps what you typed rather than throwing it out. */
        box.addEventListener('blur', function () { commitNewStar(box.value); });
        return;
      }
      var done = !isOpen(t);
      var waits = done ? [] : prereqsOf(t.id);
      var el = document.createElement('div');
      el.className = 'star' + (done ? ' ember' : (waits.length ? ' dim' : '')) +
        (t.x > .74 ? ' flip' : '');
      el.dataset.id = t.id;
      setStarMotion(el, t.id);
      var point = screenPoint(t);
      el.style.left = point.x + 'px';
      el.style.top = point.y + 'px';
      el.innerHTML =
        (done ? emberSVG() : (waits.length ? unlitSVG() : starSVG(t.id, magnitude(t)))) +
        '<div class="hit"></div>' +
        '<div class="name">' + esc(t.title) + '</div>' +
        (done ? '<div class="resolvedwhen">resolved</div>' : '') +
        (waits.length ? '<div class="waiting">waiting on ' + waits.length + '</div>' : '');
      el.title = waits.length
        ? 'waiting on ' + waits.map(function (b) { return byId[b].title; }).join(', ')
        : t.title;
      el.tabIndex = 0;
      el.setAttribute('role', 'button');
      el.setAttribute('aria-label', t.title + (done ? ', resolved' : ''));
      el.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPanel(t); }
      });
      mapField.appendChild(el);
      fitLabel(el);
    });
    poolList.innerHTML = visible().filter(function (t) { return !t.pending; }).map(function (t) {
      var waits = prereqsOf(t.id).length;
      return '<li><button type="button" data-open-task="' + esc(t.id) + '">' +
        '<span>' + esc(t.title) + '</span><small>' +
        (!isOpen(t) ? 'Resolved' : waits ? 'Waiting on ' + waits + ' task' + (waits === 1 ? '' : 's') : 'Ready') +
        '</small></button></li>';
    }).join('') || '<li class="pool-empty">No tasks here yet. Add one above.</li>';

    drawLines();
    var open = TASKS.filter(isOpen);
    var waiting = open.filter(function (t) { return prereqsOf(t.id).length; }).length;
    var done = TASKS.length - open.length;
    document.getElementById('hud').innerHTML =
      '<span class="pool-count">Pool &nbsp;&middot;&nbsp; ' + open.length + ' open' +
      (waiting ? ' &nbsp;&middot;&nbsp; ' + waiting + ' waiting' : '') +
      (done ? ' &nbsp;&middot;&nbsp; ' + done + ' resolved</span>' +
        '<button type="button" class="toggle' + (SHOW_RESOLVED ? ' on' : '') + '" id="toggle" aria-pressed="' + SHOW_RESOLVED + '">' +
        (SHOW_RESOLVED ? 'Hide resolved' : 'Show resolved') + '</button>' : '</span>');
    var tg = document.getElementById('toggle');
    if (tg) tg.addEventListener('click', function () {
      SHOW_RESOLVED = !SHOW_RESOLVED;
      closePanel();
      paint();
    });
    if (PANEL_ID && !byId[PANEL_ID]) closePanel();
  }

  /* Thin, solid, stopping short of both stars. Dashes and mid-line arrowheads
     are graph-diagram furniture; a chart just joins the stars, and direction
     is carried by which end is lit. */
  function drawLines() {
    if (!W || !H) { svg.innerHTML = ''; return; }
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    var out = '';
    var shown = {};
    visible().forEach(function (t) { shown[t.id] = 1; });
    EDGES.forEach(function (e) {
      var a = byId[e.before_id], b = byId[e.after_id];
      if (!a || !b || !shown[a.id] || !shown[b.id]) return;
      var ap = screenPoint(a), bp = screenPoint(b);
      var ax = ap.x, ay = ap.y, bx = bp.x, by = bp.y;
      var dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy) || 1;
      var pad = 13 / L;
      out += '<line x1="' + (ax + dx * pad) + '" y1="' + (ay + dy * pad) +
             '" x2="' + (bx - dx * pad) + '" y2="' + (by - dy * pad) +
             '" stroke="var(--line)" stroke-width="0.7"/>';
    });
    svg.innerHTML = out;
  }

  function resize() {
    var r = mapField.getBoundingClientRect();
    if (W === r.width && H === r.height) return;
    W = r.width; H = r.height;
    drawDust();
    paint();
  }

  function fitLabel(el) {
    var x = parseFloat(el.style.left), y = parseFloat(el.style.top);
    var flip = x > W / 2;
    el.classList.toggle('flip', flip);
    var name = el.querySelector('.name');
    name.style.width = Math.max(40, Math.min(220, (flip ? x : W - x) - 28)) + 'px';
    var height = name.offsetHeight;
    name.style.bottom = 'auto';
    name.style.top = Math.max(8 - y, Math.min(-height - 9, H - y - height - 8)) + 'px';
  }

  function screenPoint(task) {
    var mx = Math.min(34, W / 2), my = Math.min(34, H / 2);
    return { x: Math.max(mx, Math.min(W - mx, task.x * W)),
             y: Math.max(my, Math.min(H - my, task.y * H)) };
  }

  /* ---- dragging -------------------------------------------------------- */
  var drag = null;

  function cancelDrag() {
    if (!drag) return false;
    var d = drag; drag = null; bgPress = null;
    d.t.x = d.sx; d.t.y = d.sy;
    d.el.classList.remove('held');
    if (d.el.hasPointerCapture(d.id)) d.el.releasePointerCapture(d.id);
    if (d.el.isConnected) {
      var point = screenPoint(d.t);
      d.el.style.left = point.x + 'px'; d.el.style.top = point.y + 'px';
      fitLabel(d.el);
    }
    drawLines();
    if (paintPending) paint();
    return true;
  }

  sky.addEventListener('pointerdown', function (e) {
    if (e.button !== 0 || e.isPrimary === false) return;
    if (drag) return;
    var el = e.target.closest ? e.target.closest('.star') : null;
    if (!el || el.classList.contains('ghost')) return;
    var t = byId[el.dataset.id];
    if (!t) return;
    poolRevision++;
    var r = mapField.getBoundingClientRect(), point = screenPoint(t);
    el.setPointerCapture(e.pointerId);
    el.classList.add('held');
    drag = { el: el, t: t, id: e.pointerId, moved: false,
             ox: e.clientX, oy: e.clientY, sx: t.x, sy: t.y,
             grabX: e.clientX - r.left - point.x, grabY: e.clientY - r.top - point.y };
    el.addEventListener('lostpointercapture', function (event) {
      if (drag && drag.el === el && drag.id === event.pointerId) finishDrag(false);
    }, { once: true });
    e.preventDefault();
  });

  function moveDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    var dx = e.clientX - drag.ox, dy = e.clientY - drag.oy;
    if (!drag.moved && Math.hypot(dx, dy) < 4) return;   // a click, not a drag
    drag.moved = true;

    var r = mapField.getBoundingClientRect();
    drag.t.x = Math.min(Math.max((e.clientX - r.left - drag.grabX) / W, 0.02), 0.98);
    drag.t.y = Math.min(Math.max((e.clientY - r.top - drag.grabY) / H, 0.02), 0.98);
    var point = screenPoint(drag.t);
    drag.el.style.left = point.x + 'px';
    drag.el.style.top = point.y + 'px';
    fitLabel(drag.el);
    drawLines();
  }
  document.addEventListener('pointermove', moveDrag, true);

  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    if (e.type === 'pointerup') moveDrag(e);
    finishDrag(e.type === 'pointerup');
  }
  function finishDrag(openDetails) {
    if (!drag) return;
    var d = drag; drag = null;
    d.el.classList.remove('held');
    if (d.el.hasPointerCapture(d.id)) d.el.releasePointerCapture(d.id);

    if (paintPending) paint();
    if (!d.moved) { if (openDetails) openPanel(d.t); return; }
    var position = positions[d.t.id] || { saving: false };
    position.x = Number(d.t.x.toFixed(4)); position.y = Number(d.t.y.toFixed(4));
    position.confirmed = false;
    positions[d.t.id] = position;
    savePosition(d.t.id);
    drawLines();
  }
  function savePosition(id) {
    var position = positions[id];
    if (!position || position.saving || position.confirmed) return;
    position.saving = true;
    var x = position.x, y = position.y;
    post('/api/pool/task/' + id + '/move?x=' + x + '&y=' + y).then(function () {
      position.saving = false;
      if (position.x !== x || position.y !== y) { savePosition(id); return; }
      position.confirmed = true;
      if (noteEl.textContent === 'Position not saved. Retrying…') note('');
    }, function () {
      position.saving = false;
      if (position.x !== x || position.y !== y) { savePosition(id); return; }
      note('Position not saved. Retrying…', true);
    });
  }
  document.addEventListener('pointerup', endDrag, true);
  document.addEventListener('pointercancel', endDrag, true);
  window.addEventListener('blur', function () { finishDrag(false); });
  document.addEventListener('visibilitychange', function () { if (!window.stellarPageActive()) finishDrag(false); });
  sky.addEventListener('dragstart', function (e) {
    if (e.target.closest && e.target.closest('.star')) e.preventDefault();
  });

  veil.addEventListener('pointerdown', function (e) {
    if (e.target === veil) closeVeil();          // backdrop only
  });
  veil.addEventListener('keydown', function (e) {
    if (e.key !== 'Tab') return;
    var buttons = veil.querySelectorAll('button');
    var first = buttons[0], last = buttons[buttons.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  /* Empty sky. A press that dismisses something open is only a dismissal --
     you were closing the panel, not asking for a star. Anything else is a
     request to make one where you clicked. */
  var bgPress = null;
  mapField.addEventListener('pointerdown', function (e) {
    if (!e.target.closest) return;
    if (e.target.closest('.star, .new, .key, .hud, #note') || e.target.closest('#panel') ||
        e.target.closest('#veil')) return;
    var dismissing = panelEl.classList.contains('open') ||
                     veil.classList.contains('open') || !!PENDING;
    closePanel();
    bgPress = dismissing ? null : { x: e.clientX, y: e.clientY };
  });

  mapField.addEventListener('pointerup', function (e) {
    var press = bgPress;
    bgPress = null;
    if (!press || PENDING) return;
    if (Math.hypot(e.clientX - press.x, e.clientY - press.y) > 4) return;   // a drag
    if (e.target.closest &&
        (e.target.closest('.star, .new, .key, .hud, #note') || e.target.closest('#panel') ||
         e.target.closest('#veil'))) return;
    var r = mapField.getBoundingClientRect();
    beginNewStar(
      Math.min(Math.max((e.clientX - r.left) / W, 0.03), 0.97),
      Math.min(Math.max((e.clientY - r.top) / H, 0.05), 0.95)
    );
  });
  document.addEventListener('keydown', function (e) {
    if (!window.stellarPageActive()) return;
    if (e.key !== 'Escape') return;
    if (cancelDrag()) { e.preventDefault(); return; }
    if (veil.classList.contains('open')) { closeVeil(); return; }
    var linkPicker = document.getElementById('pool-link-picker');
    if (linkPicker && linkPicker.open) {
      linkPicker.open = false; linkPicker.querySelector('summary').focus(); return;
    }
    if (PENDING) { dropNewStar(); return; }
    closePanel();
  });

  /* ---- the panel ------------------------------------------------------- */
  var PANEL_ID = null;

  function closePanel() {
    PANEL_ID = null;
    panelEl.className = '';
    panelEl.innerHTML = '';
  }

  function openPanel(t) {
    PANEL_ID = t.id;
    var done = !isOpen(t);
    var waits = EDGES.filter(function (e) { return e.after_id === t.id; })
                     .map(function (e) { return byId[e.before_id]; })
                     .filter(Boolean);
    var when = '';
    if (done && t.resolved_at) {
      var d = new Date(t.resolved_at);
      when = isNaN(d) ? 'resolved' : 'resolved ' + d.toISOString().slice(0, 10);
    } else if (t.created_at) {
      var c = new Date(t.created_at);
      when = isNaN(c) ? '' : 'added ' + c.toISOString().slice(0, 10);
    }

    var html = '<div class="ptitle" id="pool-title">' + esc(t.title) + '</div>' +
      '<div class="pmeta">' + esc(when) + '</div>' +
      '<textarea id="pnotes" aria-label="Task description" placeholder="what this actually involves">' +
        esc(t.notes || '') + '</textarea>';

    if (!done) {
      var reminderLabel = t.reminder_sent_at ? 'Reminder sent ' + new Date(t.reminder_sent_at).toLocaleString() :
        t.remind_at ? 'Reminder: ' + new Date(t.remind_at).toLocaleString() : 'No reminder set';
      html += '<section class="reminder" aria-label="Star reminder"><form id="pool-reminder-form">' +
        '<label for="pool-reminder-time">Remind me</label><input id="pool-reminder-time" type="datetime-local" required>' +
        '<div class="reminder-actions"><button type="submit">Save time</button>' +
        '<button type="button" id="pool-reminder-tomorrow">In 24 hours</button>' +
        '<button type="button" id="pool-reminder-clear">Clear</button></div></form>' +
        '<p id="pool-reminder-status" role="status">' + esc(reminderLabel) + '</p>' +
        '<div data-notification-controls></div></section>';
    }

    if (waits.length) {
      html += '<div class="waits"><h4>waits on</h4>' + waits.map(function (w) {
        return '<div><span>' + esc(w.title) + '</span>' +
          (isOpen(w) ? '' : ' <span class="resolved-label">(resolved)</span>') +
          '<button data-unlink="' + w.id + '" aria-label="Remove link to ' + esc(w.title) + '">&times;</button></div>';
      }).join('') + '</div>';
    }

    var linkable = TASKS.filter(function (other) {
      return other.id !== t.id && isOpen(other) && !other.pending &&
        !EDGES.some(function (edge) { return edge.before_id === other.id && edge.after_id === t.id; });
    }).sort(function (a, b) { return a.title.localeCompare(b.title); });
    if (!done && linkable.length) {
      html += '<details class="link-picker" id="pool-link-picker"><summary>Add prerequisite</summary>' +
        '<form id="pool-link-form"><label for="pool-prerequisite">Task that must finish first</label>' +
        '<select id="pool-prerequisite" required><option value="">Choose a task…</option>' +
        linkable.map(function (other) { return '<option value="' + esc(other.id) + '">' + esc(other.title) + '</option>'; }).join('') +
        '</select><div class="link-actions"><button type="submit">Link task</button>' +
        '<button type="button" id="pool-link-cancel">Cancel</button></div></form></details>';
    }

    html += '<div class="acts">' +
      '<button class="primary" id="ptoggle">' + (done ? 'Restore' : 'Resolve') + '</button>' +
      '<button id="pclose">Close</button></div>' +
      '<button class="danger" id="pdelete">delete this star</button>';
    panelEl.innerHTML = html;
    panelEl.className = 'open';

    /* Sits beside its star, flipped or nudged so it never leaves the field. */
    var pw = 268, ph = panelEl.offsetHeight;
    var left = t.x * W + 22, top = t.y * H - 18;
    if (left + pw > W - 12) left = t.x * W - pw - 22;
    if (left < 12) left = 12;
    if (top + ph > H - 12) top = H - ph - 12;
    if (top < 12) top = 12;
    panelEl.style.left = left + 'px';
    panelEl.style.top = top + 'px';

    var reminderForm = document.getElementById('pool-reminder-form');
    if (reminderForm) {
      var reminderInput = document.getElementById('pool-reminder-time');
      if (t.remind_at) {
        var localTime = new Date(t.remind_at);
        reminderInput.value = new Date(localTime.getTime() - localTime.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
      }
      var reminderStatus = document.getElementById('pool-reminder-status');
      function saveReminder(at) {
        var buttons = reminderForm.querySelectorAll('button');
        buttons.forEach(function (button) { button.disabled = true; });
        return post('/api/pool/task/' + t.id + '/reminder', 'POST', { at: at }).then(function (row) {
          t.remind_at = row.remind_at; t.reminder_sent_at = row.reminder_sent_at; t.reminder_version = row.reminder_version;
          if (PANEL_ID === t.id) openPanel(t);
          note(at ? 'Reminder saved' : 'Reminder cleared');
        }).catch(function (err) {
          reminderStatus.textContent = err.message;
          buttons.forEach(function (button) { button.disabled = false; });
        });
      }
      reminderForm.addEventListener('submit', function (event) {
        event.preventDefault();
        var date = new Date(reminderInput.value);
        if (isNaN(date.getTime()) || date.getTime() <= Date.now()) { reminderStatus.textContent = 'Choose a future reminder time.'; return; }
        saveReminder(date.toISOString());
      });
      document.getElementById('pool-reminder-tomorrow').addEventListener('click', function () { saveReminder(new Date(Date.now() + 86400000).toISOString()); });
      document.getElementById('pool-reminder-clear').addEventListener('click', function () { saveReminder(null); });
      if (window.StellarNotifications) window.StellarNotifications.mount(panelEl.querySelector('[data-notification-controls]'));
    }

    var linkPicker = document.getElementById('pool-link-picker');
    if (linkPicker) {
      linkPicker.addEventListener('toggle', function () {
        var box = panelEl.getBoundingClientRect(), bounds = sky.getBoundingClientRect();
        if (box.bottom > bounds.bottom - 12) panelEl.style.top = Math.max(12, panelEl.offsetTop - (box.bottom - bounds.bottom + 12)) + 'px';
      });
      document.getElementById('pool-link-cancel').addEventListener('click', function () {
        linkPicker.open = false; linkPicker.querySelector('summary').focus();
      });
      document.getElementById('pool-link-form').addEventListener('submit', function (event) {
        event.preventDefault();
        var before = byId[document.getElementById('pool-prerequisite').value];
        if (!before) return;
        var controls = Array.prototype.slice.call(this.querySelectorAll('button,select'));
        controls.forEach(function (control) { control.disabled = true; });
        post('/api/pool/link?before_id=' + encodeURIComponent(before.id) + '&after_id=' + encodeURIComponent(t.id))
          .then(function (result) {
            if (!result.already) EDGES.push({ before_id: before.id, after_id: t.id });
            note(t.title + ' now waits on ' + before.title);
            paint(); openPanel(t);
          })
          .catch(function (err) {
            note(err.message, true);
            controls.forEach(function (control) { control.disabled = false; });
          });
      });
    }

    document.getElementById('pclose').addEventListener('click', closePanel);
    document.getElementById('pdelete').addEventListener('click', function () {
      confirmDelete(t);
    });
    document.getElementById('ptoggle').addEventListener('click', function () {
      setResolved(t, !done);
    });
    /* change, not input: saved when you finish rather than per keystroke. */
    document.getElementById('pnotes').addEventListener('change', function () {
      var text = this.value;
      post('/api/pool/task/' + t.id + '/notes?text=' + encodeURIComponent(text))
        .then(function (row) { t.notes = row.notes; note('description saved'); })
        .catch(function (err) { note(err.message, true); });
    });
    Array.prototype.forEach.call(panelEl.querySelectorAll('[data-unlink]'), function (b) {
      b.addEventListener('click', function () {
        var before = byId[b.dataset.unlink] ? byId[b.dataset.unlink].id : b.dataset.unlink;
        post('/api/pool/unlink?before_id=' + before + '&after_id=' + t.id)
          .then(function () {
            EDGES = EDGES.filter(function (e) {
              return !(e.before_id === before && e.after_id === t.id);
            });
            note('unlinked');
            paint();
            openPanel(t);
          })
          .catch(function (err) { note(err.message, true); });
      });
    });
  }

  /* ---- deleting ---------------------------------------------------------
     Resolving is for work that happened. This is for a star that should not
     exist -- a typo, a duplicate, something that stopped mattering -- and it
     does not come back, so it says exactly what goes with it first. */
  function closeVeil() {
    veil.className = '';
    veil.querySelector('.box').innerHTML = '';
    var button = document.getElementById('pdelete');
    if (button) button.focus();
  }

  function confirmDelete(t) {
    var links = EDGES.filter(function (e) {
      return e.before_id === t.id || e.after_id === t.id;
    }).length;

    var loses = [];
    if (links) loses.push(links + (links === 1 ? ' link' : ' links') + ' to other stars');
    if (t.notes) loses.push('its description');

    veil.querySelector('.box').innerHTML =
      '<h3 id="veilh">Delete this star</h3>' +
      '<p>' + esc(t.title) + '</p>' +
      '<p class="delete-note">' +
        'This cannot be undone. Resolving keeps it, and lets it come back.</p>' +
      (loses.length
        ? '<div class="loses">goes with it:<br>&nbsp;&nbsp;' +
          loses.join('<br>&nbsp;&nbsp;') + '</div>'
        : '') +
      '<div class="vacts">' +
        '<button id="vcancel">Cancel</button>' +
        '<button class="wreck" id="vgo">Delete</button></div>';
    veil.className = 'open';
    document.getElementById('vcancel').focus();   // the safe one, not the wreck

    document.getElementById('vcancel').addEventListener('click', closeVeil);
    document.getElementById('vgo').addEventListener('click', function () {
      post('/api/pool/task/' + t.id, 'DELETE')
        .then(function () {
          delete positions[t.id];
          TASKS = TASKS.filter(function (x) { return x.id !== t.id; });
          /* The cascade drops these server-side; mirror it here so the sky does
             not draw a line to a star that is gone. */
          EDGES = EDGES.filter(function (e) {
            return e.before_id !== t.id && e.after_id !== t.id;
          });
          note(t.title + ' deleted');
          closeVeil();
          closePanel();
          paint();
        })
        .catch(function (err) { note(err.message, true); closeVeil(); });
    });
  }

  function setResolved(t, done) {
    var waits = done ? prereqsOf(t.id) : [];
    post('/api/pool/task/' + t.id + '/resolve?done=' + done)
      .then(function (row) {
        t.resolved_at = row.resolved_at;
        t.remind_at = row.remind_at; t.reminder_sent_at = row.reminder_sent_at;
        note(done
          ? (waits.length
              ? t.title + ' resolved, ahead of ' + waits.length + ' it was waiting on'
              : t.title + ' resolved')
          : t.title + ' restored');
        /* A resolved star only stays on screen while the toggle is on. */
        if (done && !SHOW_RESOLVED) closePanel(); else openPanel(t);
        paint();
      })
      .catch(function (err) { note(err.message, true); });
  }


  /* ---- adding ---------------------------------------------------------- */
  document.getElementById('pool-add').addEventListener('submit', function (e) {
    e.preventDefault();
    var self = document.getElementById('add');
    var button = this.querySelector('button');
    var title = self.value.trim();
    if (!title) return;
    self.disabled = true;
    button.disabled = true;
    /* New stars land somewhere empty-ish rather than on top of an existing
       one: the sky is mostly empty, so a few tries is enough. */
    var spot = freeSpot();
    post('/api/pool/task?title=' + encodeURIComponent(title) +
         '&x=' + spot.x.toFixed(4) + '&y=' + spot.y.toFixed(4))
      .then(function (row) {
        row.x = Number(row.x); row.y = Number(row.y);
        TASKS.push(row);
        self.value = '';
        note(title + ' added · reminder in 24 hours');
        paint();
      })
      .catch(function (err) { note(err.message, true); })
      .then(function () {
        self.disabled = false; button.disabled = false;
        if (!matchMedia('(max-width: 760px)').matches) self.focus();
      });
  });

  function freeSpot() {
    var best = { x: 0.5, y: 0.5 }, bestGap = -1;
    for (var i = 0; i < 40; i++) {
      var c = { x: 0.12 + Math.random() * 0.76, y: 0.14 + Math.random() * 0.68 };
      var gap = Infinity;
      TASKS.forEach(function (t) {
        gap = Math.min(gap, Math.hypot(t.x - c.x, t.y - c.y));
      });
      if (gap > bestGap) { bestGap = gap; best = c; }
      if (bestGap > 0.18) break;
    }
    return best;
  }

  /* Another machine may resolve or rearrange the same pool. Poll only while
     this page is visible, and never replace local state during a write, drag,
     or text edit. A stable serialized comparison avoids rebuilding the DOM
     when the database has not changed. */
  var pollBusy = false;
  function poolSnapshot(tasks, edges) {
    return JSON.stringify([tasks, edges]);
  }
  function poolEditing() {
    return writesInFlight || drag || PENDING || panelEl.contains(document.activeElement);
  }
  function pollPool() {
    if (!window.stellarPageActive() || !embeddedVisible || pollBusy || poolEditing()) return;
    Object.keys(positions).forEach(savePosition);
    if (writesInFlight) return;
    var revision = poolRevision;
    pollBusy = true;
    if (!poolLoaded) {
      document.getElementById('pool-load-status').textContent = 'Loading Pool…';
      poolLoading.querySelector('.stellar-spinner').hidden = false; poolRetry.hidden = true;
    }
    fetch('/api/pool?resolved=true').then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function (state) {
      if (revision !== poolRevision || poolEditing()) return;
      if (state.schema_missing) throw new Error('Pool is unavailable');
      var tasks = state.tasks || [], edges = state.edges || [];
      tasks.forEach(function (task) {
        var position = positions[task.id];
        if (!position) return;
        if (position.confirmed && Math.abs(Number(task.x) - position.x) < .00001 &&
            Math.abs(Number(task.y) - position.y) < .00001) {
          delete positions[task.id];
        } else {
          task.x = position.x; task.y = position.y;
        }
      });
      poolLoaded = true; sky.dataset.loading = 'false'; poolLoading.hidden = true;
      if (poolSnapshot(tasks, edges) === poolSnapshot(TASKS, EDGES)) return;
      var selected = PANEL_ID;
      if (requestedStar) {
        selected = requestedStar;
        requestedStar = null;
        if (tasks.some(function (task) { return String(task.id) === selected && !isOpen(task); })) SHOW_RESOLVED = true;
      }
      TASKS = tasks;
      EDGES = edges;
      paint();
      if (selected && byId[selected] && (SHOW_RESOLVED || isOpen(byId[selected]))) {
        openPanel(byId[selected]);
      } else if (selected) {
        closePanel();
      }
    }).catch(function () {
      /* Background refresh failure should not disturb a usable cached page. */
      if (!poolLoaded) {
        document.getElementById('pool-load-status').textContent = 'Could not load Pool. Check your connection and retry.';
        poolLoading.querySelector('.stellar-spinner').hidden = true; poolRetry.hidden = false;
      }
    }).then(function () { pollBusy = false; });
  }
  window.setInterval(pollPool, 15000);
  poolRetry.addEventListener('click', pollPool);
  document.addEventListener('visibilitychange', function () {
    if (window.stellarPageActive()) pollPool();
  });

  poolList.addEventListener('click', function (e) {
    var button = e.target.closest('[data-open-task]');
    if (button && byId[button.dataset.openTask]) openPanel(byId[button.dataset.openTask]);
  });
  document.querySelector('.pool-view').addEventListener('click', function (e) {
    var button = e.target.closest('[data-pool-view]');
    if (!button) return;
    closePanel();
    sky.dataset.view = button.dataset.poolView;
    try { localStorage.setItem(viewKey, sky.dataset.view); } catch (err) {}
    document.querySelectorAll('[data-pool-view]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b === button));
    });
    resize();
  });
  var resizeQueued = false;
  function scheduleResize() {
    if (resizeQueued) return;
    resizeQueued = true;
    requestAnimationFrame(function () {
      resizeQueued = false;
      var height = document.querySelector('.pool-toolbar').getBoundingClientRect().height;
      sky.style.setProperty('--pool-toolbar-height', height + 'px');
      resize();
    });
  }
  new ResizeObserver(scheduleResize).observe(document.querySelector('.pool-toolbar'));
  new ResizeObserver(scheduleResize).observe(mapField);
  new ResizeObserver(function () {
    if (!panelEl.classList.contains('open')) return;
    var box = panelEl.getBoundingClientRect(), bounds = sky.getBoundingClientRect();
    if (box.bottom > bounds.bottom - 12) panelEl.style.top = Math.max(12, panelEl.offsetTop - (box.bottom - bounds.bottom + 12)) + 'px';
  }).observe(panelEl);
  window.addEventListener('resize', scheduleResize);
  resize();
  if (BOOT.embedded && parent !== window) parent.postMessage({ type: 'stellar:pool-background-ready' }, location.origin);
  if (!poolLoaded) requestAnimationFrame(function () { requestAnimationFrame(pollPool); });
})();
</script>
