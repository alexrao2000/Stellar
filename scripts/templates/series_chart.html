<title>Stellar</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.mono {
  font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  font-variant-numeric: tabular-nums;
}
.wrap { max-width: 1060px; margin: 0 auto; padding: 32px 20px 64px; }

.eyebrow {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--ink-muted); margin: 0 0 8px;
}
h1 {
  font-size: 1.7rem; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 6px;
  text-wrap: balance;
}
.sub { color: var(--ink-muted); font-size: 0.92rem; margin: 0; line-height: 1.5; max-width: 60ch; }

/* Readout */
.readout {
  display: flex; align-items: flex-end; gap: 28px; flex-wrap: wrap;
  margin: 28px 0 20px; padding: 22px 24px;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 10px;
  box-shadow: var(--shadow);
}
.readout .now { display: flex; flex-direction: column; }
.readout .now .lbl {
  font-family: ui-monospace, Menlo, monospace; font-size: 0.66rem;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 6px;
}
.readout .now .val {
  font-family: ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums;
  font-size: clamp(2.6rem, 8vw, 3.9rem); font-weight: 600; line-height: 0.95;
  letter-spacing: -0.03em;
}
.readout .now .val .unit {
  font-size: 0.3em; font-weight: 500; color: var(--ink-muted); margin-left: 8px;
  letter-spacing: 0.06em;
}
.readout .now .when { font-size: 0.78rem; color: var(--ink-muted); margin-top: 8px; }
.deltas { display: flex; gap: 26px; flex-wrap: wrap; margin-left: auto; }
.delta { display: flex; flex-direction: column; gap: 5px; }
.delta .lbl {
  font-family: ui-monospace, Menlo, monospace; font-size: 0.62rem;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-muted);
}
.delta .v {
  font-family: ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums;
  font-size: 1.32rem; font-weight: 600;
}
.v.down { color: var(--down); }
.v.up { color: var(--up); }

/* Stat strip */
.strip {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(122px, 1fr));
  gap: 1px; background: var(--rule); border: 1px solid var(--rule);
  border-radius: 10px; overflow: hidden; margin-bottom: 22px; box-shadow: var(--shadow);
}
.cell { background: var(--surface); padding: 13px 15px; }
.cell .lbl {
  font-family: ui-monospace, Menlo, monospace; font-size: 0.62rem;
  letter-spacing: 0.11em; text-transform: uppercase; color: var(--ink-muted);
  display: block; margin-bottom: 5px;
}
.cell .v {
  font-family: ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums;
  font-size: 1.16rem; font-weight: 600; display: block;
}
.cell .sub2 { font-size: 0.68rem; color: var(--ink-muted); margin-top: 3px; display: block; }

/* Chart card */
.card {
  background: var(--surface); border: 1px solid var(--rule); border-radius: 10px;
  box-shadow: var(--shadow); overflow: hidden;
}
.card-head {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 14px 18px; border-bottom: 1px solid var(--rule); background: var(--surface-2);
}
.card-head h2 {
  font-size: 0.95rem; font-weight: 650; margin: 0; letter-spacing: -0.005em;
}
.legend { display: flex; gap: 14px; align-items: center; font-size: 0.74rem; color: var(--ink-muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.swatch.dot { width: 7px; height: 7px; border-radius: 50%; }
.seg { display: inline-flex; background: var(--bg); border-radius: 7px; padding: 2px; gap: 2px; margin-left: auto; }
.seg button {
  border: none; background: transparent; color: var(--ink-muted);
  font-family: ui-monospace, Menlo, monospace; font-size: 0.74rem; font-weight: 600;
  padding: 5px 11px; border-radius: 5px; cursor: pointer; letter-spacing: 0.04em;
  transition: background 0.12s, color 0.12s;
}
.seg button:hover { color: var(--ink); }
.seg button.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.seg button:focus-visible, .iconbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.chart-host { position: relative; padding: 8px 8px 4px; }
canvas { display: block; width: 100%; height: 340px; touch-action: pan-y; }
.tip {
  position: absolute; pointer-events: none; opacity: 0; transition: opacity 0.1s;
  background: var(--ink); color: var(--surface); padding: 7px 10px; border-radius: 6px;
  font-family: ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums;
  font-size: 0.74rem; white-space: nowrap; z-index: 5; line-height: 1.45;
  box-shadow: 0 3px 12px rgba(0,0,0,0.22);
}
.tip.on { opacity: 1; }
.tip .tw { font-size: 0.95rem; font-weight: 700; }
.tip .tt { color: var(--trend); }
.chart-hint { display: none; padding: 0 14px; font-size: 13px; color: var(--ink-muted); }
.chart-empty { margin-top: 16px; }
.chart-empty a, .chart-empty button { display: inline-flex; align-items: center; min-height: 44px;
  padding: 8px 12px; border: 1px solid var(--rule); border-radius: 7px; font: inherit;
  background: var(--surface); color: var(--ink); text-decoration: none; cursor: pointer; }

footer.foot {
  margin-top: 20px; font-size: 0.75rem; color: var(--ink-muted); line-height: 1.6;
  border-top: 1px solid var(--rule); padding-top: 12px;
}
footer.foot b { color: var(--ink); font-weight: 600; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 620px) {
  .deltas { margin-left: 0; gap: 20px; }
  canvas { height: 280px; }
  .legend { width: 100%; order: 3; }
  .seg { margin-left: 0; }
}

</style>

<div class="wrap">
  <p class="eyebrow" id="eyebrow"></p>
  <h1 id="page-title"></h1>
  <p class="sub" id="page-sub"></p>

  <div class="readout">
    <div class="now">
      <span class="lbl" id="lbl-latest">Latest</span>
      <span class="val mono" id="r-now">&mdash;<span class="unit"></span></span>
      <span class="when" id="r-when"></span>
    </div>
    <div class="deltas">
      <div class="delta"><span class="lbl">Since start</span><span class="v mono" id="r-since"></span></div>
      <div class="delta"><span class="lbl">Last 30 days</span><span class="v mono" id="r-30"></span></div>
      <div class="delta"><span class="lbl">From peak</span><span class="v mono" id="r-peak"></span></div>
    </div>
  </div>
  <div id="chart-empty" class="chart-empty" hidden>
    <a href="/?view=day" target="_top">Open daily check-in</a>
    <button id="chart-retry" type="button">Retry</button>
  </div>

  <div class="strip">
    <div class="cell"><span class="lbl" id="lbl-start">Start</span><span class="v mono" id="s-start"></span><span class="sub2" id="s-start-d"></span></div>
    <div class="cell"><span class="lbl" id="lbl-low">Lowest</span><span class="v mono" id="s-low"></span><span class="sub2" id="s-low-d"></span></div>
    <div class="cell"><span class="lbl" id="lbl-high">Highest</span><span class="v mono" id="s-high"></span><span class="sub2" id="s-high-d"></span></div>
    <div class="cell"><span class="lbl">Average</span><span class="v mono" id="s-avg"></span><span class="sub2">all time</span></div>
    <div class="cell"><span class="lbl" id="lbl-days">Days logged</span><span class="v mono" id="s-n"></span><span class="sub2" id="s-span"></span></div>
  </div>

  <div class="card">
    <div class="card-head">
      <h2 id="chart-title">All time</h2>
      <div class="legend">
        <span><i class="swatch dot" style="background:var(--series)"></i><span id="lg-a">Daily</span></span>
        <span><i class="swatch trend"></i>7-day average</span>
      </div>
      <div class="seg" role="group" aria-label="Time range">
        <button type="button" data-r="30">30D</button>
        <button type="button" data-r="90">3M</button>
        <button type="button" data-r="180">6M</button>
        <button type="button" data-r="365">1Y</button>
        <button type="button" data-r="0" class="active">ALL</button>
      </div>
    </div>
    <div class="chart-host">
      <p class="chart-hint">Tap a point to inspect it. Tap outside the chart to dismiss.</p>
      <canvas id="chart" tabindex="0" aria-describedby="tip"></canvas>
      <div class="tip mono" id="tip" role="status" aria-live="polite"></div>
    </div>
  </div>

  <footer class="foot">
    <b>Read-only.</b> Rendered from <span class="mono">task_history</span> &mdash; <span class="mono" id="f-count"></span> <span id="f-noun">entries</span>, <span class="mono" id="f-range"></span>.
  </footer>
</div>

<script id="bootstrap" type="application/json">__BOOTSTRAP__</script>
<script>
(function () {
  var BOOT = JSON.parse(document.getElementById('bootstrap').textContent);
  var ALL;

  var MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var DAY = 86400000;

  function fmtDate(t) {
    var d = new Date(t);
    return MO[d.getUTCMonth()] + ' ' + d.getUTCDate() + ', ' + d.getUTCFullYear();
  }
  function fmtShort(t) {
    var d = new Date(t);
    return MO[d.getUTCMonth()] + " '" + String(d.getUTCFullYear()).slice(2);
  }
  /* Non-ASCII is written as \u escapes throughout: the page carries no charset
     declaration of its own, so a raw UTF-8 glyph here renders as mojibake
     wherever the host serves text/html without charset=utf-8. */
  /* Two shapes so far: a plain number (lbs) and a clock time (wake-up, held as
     minutes past midnight). The chart machinery is identical; only formatting
     and axis direction differ, so both come from BOOT.cfg. */
  var CFG = BOOT.cfg;
  document.title = CFG.title + ' · Stellar';
  document.getElementById('page-title').textContent = CFG.title;
  document.getElementById('eyebrow').textContent = CFG.eyebrow;
  document.getElementById('page-sub').textContent = CFG.sub;
  document.getElementById('lg-a').textContent = CFG.legend || 'Daily';
  document.getElementById('f-noun').textContent = CFG.noun || 'entries';
  document.getElementById('chart').setAttribute('aria-label', CFG.title + ' over time. Use left and right arrow keys to inspect readings.');
  document.getElementById('chart-retry').addEventListener('click', function () { location.reload(); });
  if (CFG.statLabels) {
    Object.keys(CFG.statLabels).forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.textContent = CFG.statLabels[id];
    });
  }
  function fmtVal(v) {
    if (CFG.format === 'time') {
      var m = Math.round(v), h = Math.floor(m / 60) % 24;
      return String(h).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
    }
    return v.toFixed(1);
  }
  function signed(v) {
    var s = (v > 0 ? '+' : v < 0 ? '\u2212' : '');
    if (CFG.format === 'time') {
      var m = Math.round(Math.abs(v));
      return s + Math.floor(m / 60) + 'h' + String(m % 60).padStart(2, '0');
    }
    return s + Math.abs(v).toFixed(1);
  }
  function setDelta(el, v, suffix) {
    el.textContent = signed(v) + (suffix || '');
    el.classList.toggle('down', v < 0);
    el.classList.toggle('up', v > 0);
  }

  /* Trailing 7-calendar-day mean, so gaps in logging don't distort the line. */
  function movingAvg(pts) {
    var out = [], lo = 0;
    for (var i = 0; i < pts.length; i++) {
      while (pts[lo].t < pts[i].t - 6 * DAY) lo++;
      var s = 0;
      for (var j = lo; j <= i; j++) s += pts[j].w;
      out.push(s / (i - lo + 1));
    }
    return out;
  }

  function start() {
  ALL.forEach(function (p) { p.t = Date.parse(p.d + 'T00:00:00Z'); });
  ALL.sort(function (a, b) { return a.t - b.t; });

  /* ---- Summary stats (always all-time) ---- */
  var first = ALL[0], last = ALL[ALL.length - 1];
  var lowest = ALL.reduce(function (a, b) { return b.w < a.w ? b : a; });
  var highest = ALL.reduce(function (a, b) { return b.w > a.w ? b : a; });
  var avg = ALL.reduce(function (s, p) { return s + p.w; }, 0) / ALL.length;
  var cutoff30 = last.t - 30 * DAY;
  var win30 = ALL.filter(function (p) { return p.t >= cutoff30; });

  document.getElementById('r-now').innerHTML =
    fmtVal(last.w) + (CFG.unit ? '<span class="unit">' + CFG.unit + '</span>' : '');
  document.getElementById('r-when').textContent = fmtDate(last.t);
  setDelta(document.getElementById('r-since'), last.w - first.w);
  setDelta(document.getElementById('r-30'), win30.length > 1 ? last.w - win30[0].w : 0);
  setDelta(document.getElementById('r-peak'), last.w - highest.w);

  document.getElementById('s-start').textContent = fmtVal(first.w);
  document.getElementById('s-start-d').textContent = fmtDate(first.t);
  document.getElementById('s-low').textContent = fmtVal(lowest.w);
  document.getElementById('s-low-d').textContent = fmtDate(lowest.t);
  document.getElementById('s-high').textContent = fmtVal(highest.w);
  document.getElementById('s-high-d').textContent = fmtDate(highest.t);
  document.getElementById('s-avg').textContent = fmtVal(avg);
  document.getElementById('s-n').textContent = ALL.length;
  document.getElementById('s-span').textContent = fmtShort(first.t) + ' \u2013 ' + fmtShort(last.t);
  document.getElementById('f-count').textContent = ALL.length;
  document.getElementById('f-range').textContent = first.d + ' \u2192 ' + last.d;

  /* ---- Chart ---- */
  var cv = document.getElementById('chart');
  var ctx = cv.getContext('2d');
  var tip = document.getElementById('tip');
  var range = 0, view = ALL, avgLine = movingAvg(ALL), geo = null, hoverIdx = -1;

  function css(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function setRange(days) {
    try { localStorage.setItem('stellar:chart-range:' + BOOT.endpoint, String(days)); } catch (e) {}
    range = days;
    view = days ? ALL.filter(function (p) { return p.t >= last.t - days * DAY; }) : ALL;
    if (view.length < 2) view = ALL.slice(-2);
    avgLine = movingAvg(view);
    document.getElementById('chart-title').textContent =
      days === 0 ? 'All time' : days === 365 ? 'Last 12 months'
      : days === 180 ? 'Last 6 months' : days === 90 ? 'Last 3 months' : 'Last 30 days';
    draw();
  }

  function niceTicks(min, max, target) {
    var span = max - min || 1;
    var raw = span / target;
    var mag = Math.pow(10, Math.floor(Math.log10(raw)));
    var norm = raw / mag;
    var step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
    var out = [], v = Math.ceil(min / step) * step;
    for (; v <= max + 1e-9; v += step) out.push(Math.round(v * 100) / 100);
    return out;
  }

  function draw() {
    var dpr = window.devicePixelRatio || 1;
    var w = cv.clientWidth, h = cv.clientHeight;
    if (!w || !h) return;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    var cInk = css('--ink'), cMut = css('--ink-muted'), cGrid = css('--grid');
    var cAcc = css('--series'), cTr = css('--trend'), cSurf = css('--surface');

    var padL = 46, padR = 14, padT = 14, padB = 30;
    var iw = w - padL - padR, ih = h - padT - padB;

    var lo = Math.min.apply(null, view.map(function (p) { return p.w; }));
    var hi = Math.max.apply(null, view.map(function (p) { return p.w; }));
    var pad = Math.max((hi - lo) * 0.12, 1.2);
    var yMin = lo - pad, yMax = hi + pad;
    var flip = !!CFG.invert;  /* earlier at the bottom for a clock axis */
    var t0 = view[0].t, t1 = view[view.length - 1].t || t0 + DAY;

    function X(t) { return padL + (t1 === t0 ? 0 : (t - t0) / (t1 - t0)) * iw; }
    function Y(v) {
      var f = (v - yMin) / (yMax - yMin);
      return padT + (flip ? f : 1 - f) * ih;
    }
    geo = { X: X, Y: Y, padL: padL, iw: iw, t0: t0, t1: t1 };

    /* y grid */
    ctx.font = '11px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    niceTicks(yMin, yMax, 5).forEach(function (v) {
      var y = Y(v);
      ctx.strokeStyle = cGrid; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(padL, Math.round(y) + 0.5); ctx.lineTo(w - padR, Math.round(y) + 0.5); ctx.stroke();
      ctx.fillStyle = cMut; ctx.fillText((CFG.format === 'time' ? fmtVal(v) : v.toFixed(0)), padL - 9, y);
    });

    /* x labels */
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    var seen = {}, labels = [];
    view.forEach(function (p) {
      var d = new Date(p.t), k = d.getUTCFullYear() + '-' + d.getUTCMonth();
      if (!seen[k]) { seen[k] = 1; labels.push(p.t); }
    });
    var stride = Math.ceil(labels.length / Math.max(2, Math.floor(iw / 74)));
    labels.forEach(function (t, i) {
      if (i % stride) return;
      ctx.fillStyle = cMut;
      ctx.fillText(fmtShort(t), X(t), h - padB + 8);
    });

    /* daily points */
    ctx.fillStyle = cAcc;
    var r = view.length > 400 ? 1.3 : view.length > 150 ? 1.9 : 2.6;
    ctx.globalAlpha = view.length > 400 ? 0.5 : 0.72;
    view.forEach(function (p) {
      ctx.beginPath(); ctx.arc(X(p.t), Y(p.w), r, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;

    /* moving-average line */
    ctx.strokeStyle = cTr; ctx.lineWidth = 2.1;
    ctx.setLineDash([5, 4]);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath();
    view.forEach(function (p, i) {
      var x = X(p.t), y = Y(avgLine[i]);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.stroke();
    ctx.setLineDash([]);

    /* hover crosshair */
    if (hoverIdx >= 0 && hoverIdx < view.length) {
      var p = view[hoverIdx], hx = X(p.t);
      ctx.strokeStyle = cMut; ctx.globalAlpha = 0.4; ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(hx, padT); ctx.lineTo(hx, h - padB); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;

      ctx.fillStyle = cTr;
      ctx.beginPath(); ctx.arc(hx, Y(avgLine[hoverIdx]), 3.6, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = cAcc; ctx.strokeStyle = cSurf; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(hx, Y(p.w), 4.6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
  }

  function nearest(clientX) {
    if (!geo) return -1;
    var rect = cv.getBoundingClientRect();
    var x = clientX - rect.left;
    var frac = (x - geo.padL) / geo.iw;
    var t = geo.t0 + frac * (geo.t1 - geo.t0);
    var best = 0, bd = Infinity;
    for (var i = 0; i < view.length; i++) {
      var d = Math.abs(view[i].t - t);
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  }

  function showTip(clientX) {
    var i = nearest(clientX);
    if (i < 0) return;
    hoverIdx = i; draw();
    var p = view[i];
    tip.innerHTML = '<span class="tw">' + fmtVal(p.w) +
      (CFG.unit ? ' ' + CFG.unit : '') + '</span><br>' + fmtDate(p.t) +
      '<br><span class="tt">avg ' + fmtVal(avgLine[i]) + '</span>';
    tip.classList.add('on');
    var host = cv.parentElement.getBoundingClientRect();
    var px = geo.X(p.t), py = geo.Y(p.w);
    var tw = tip.offsetWidth, th = tip.offsetHeight;
    var left = px + 14;
    if (left + tw > host.width - 4) left = px - tw - 14;
    tip.style.left = Math.max(4, left) + 'px';
    tip.style.top = Math.max(4, Math.min(py - th / 2, host.height - th - 4)) + 'px';
  }
  function hideTip() { hoverIdx = -1; tip.classList.remove('on'); draw(); }

  cv.addEventListener('pointerdown', function (e) { showTip(e.clientX); });
  cv.addEventListener('pointermove', function (e) { showTip(e.clientX); });
  cv.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') hideTip(); });
  cv.addEventListener('pointercancel', hideTip);
  document.addEventListener('pointerdown', function (e) { if (e.target !== cv) hideTip(); });
  cv.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    var i = hoverIdx < 0 ? view.length - 1 : hoverIdx + (e.key === 'ArrowLeft' ? -1 : 1);
    i = Math.max(0, Math.min(view.length - 1, i));
    showTip(cv.getBoundingClientRect().left + geo.X(view[i].t));
  });

  Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function (b) {
    b.setAttribute('aria-pressed', String(b.classList.contains('active')));
    b.addEventListener('click', function () {
      document.querySelectorAll('.seg button').forEach(function (x) { x.classList.remove('active'); x.setAttribute('aria-pressed', 'false'); });
      b.classList.add('active');
      b.setAttribute('aria-pressed', 'true');
      hoverIdx = -1; tip.classList.remove('on');
      setRange(Number(b.dataset.r));
    });
  });

  window.addEventListener('resize', draw);

  /* draw() no-ops while the canvas has zero size. In an embedded frame the
     element can get its real size after load, and that resizes no window --
     so without this the chart would stay permanently blank. */
  if (window.ResizeObserver) {
    new ResizeObserver(function () { draw(); }).observe(cv);
  } else {
    var tries = 0;
    var poll = setInterval(function () {
      if (cv.clientWidth && cv.clientHeight) { draw(); clearInterval(poll); }
      if (++tries > 40) clearInterval(poll);
    }, 100);
  }
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    (mq.addEventListener ? mq.addEventListener.bind(mq, 'change') : mq.addListener.bind(mq))(draw);
  }
  new MutationObserver(draw).observe(document.documentElement, {
    attributes: true, attributeFilter: ['data-theme']
  });

  var rememberedRange = 0;
  try { rememberedRange = Number(localStorage.getItem('stellar:chart-range:' + BOOT.endpoint)); } catch (e) {}
  if (![0, 30, 90, 180, 365].includes(rememberedRange)) rememberedRange = 0;
  document.querySelectorAll('.seg button').forEach(function (b) {
    var active = Number(b.dataset.r) === rememberedRange;
    b.classList.toggle('active', active); b.setAttribute('aria-pressed', String(active));
  });
  setRange(rememberedRange);
  }

  function unavailable(message, retry) {
    document.getElementById('r-now').textContent = '\u2014';
    document.getElementById('r-when').textContent = message;
    ['.deltas', '.strip', '.card', 'footer.foot'].forEach(function (selector) {
      document.querySelector(selector).hidden = true;
    });
    document.getElementById('chart-empty').hidden = false;
    document.getElementById('chart-retry').hidden = !retry;
  }

  if (BOOT.mode === 'live') {
    fetch(BOOT.endpoint, { headers: BOOT.headers || {} })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (data) {
        if (!data.length) { unavailable('No readings yet. Record one in your daily check-in.', false); return; }
        ALL = data;
        start();
      })
      .catch(function (err) {
        unavailable('Could not load your readings. Check your connection and retry.', true);
      });
  } else {
    ALL = BOOT.data;
    start();
  }
})();
</script>
