<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Sign in · Stellar</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid;
      place-items: center; padding: 20px; background: var(--bg); color: var(--ink); }
    main { width: min(100%, 360px); background: var(--surface); border: 1px solid var(--rule);
      border-radius: 20px; padding: 28px; box-shadow: var(--shadow); }
    .eyebrow { margin: 0 0 8px; font: 11px ui-monospace, Menlo, monospace;
      letter-spacing: .16em; text-transform: uppercase; color: var(--ink-muted); }
    h1 { margin: 0 0 22px; font-size: 1.55rem; }
    label { display: block; margin: 14px 0 5px; font-size: .78rem; font-weight: 650; }
    input { width: 100%; padding: 11px 12px; border: 1px solid var(--rule);
      border-radius: 9px; background: var(--surface-2); color: var(--ink); font: inherit; }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button { width: 100%; margin-top: 20px; padding: 11px; border: 0; border-radius: 9px;
      background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 650; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #error { min-height: 1.2em; margin: 12px 0 0; color: var(--ink); font-size: .82rem; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow stellar-wordmark"><img src="/app-assets/stellar.svg" width="32" height="32" alt="">Stellar</p>
    <h1>Sign in</h1>
    <form id="login">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
      <p id="error" role="alert"></p>
    </form>
    <button type="button" class="install-button" data-install hidden>Install app</button>
  </main>
  <script>
    var next = __NEXT__;
    document.getElementById('login').addEventListener('submit', function (event) {
      event.preventDefault();
      var button = this.querySelector('button');
      var error = document.getElementById('error');
      button.disabled = true; error.textContent = '';
      fetch('/auth/login', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email: document.getElementById('email').value,
          password: document.getElementById('password').value})
      }).then(function (response) {
        return response.json().catch(function () { return {}; }).then(function (body) {
          if (!response.ok) throw new Error(body.detail || 'Sign-in failed');
          location.replace(next);
        });
      }).catch(function (err) {
        error.textContent = err.message; button.disabled = false;
      });
    });
  </script>
</body>
</html>
